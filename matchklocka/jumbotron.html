<!doctype html><html lang="sv"><head><meta charset="utf-8"><title>Matchklocka – Jumbotron</title><link rel="stylesheet" href="style.css"><style>
body{height:100vh;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;cursor:none}.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:2vh 3vw}
.tm{text-align:center}.nm{font-size:5vw;font-weight:900;text-transform:uppercase;border-bottom:.6vh solid #AF2E32}.g{font-size:22vw;font-weight:900;line-height:1}
.mid{text-align:center}#c{font-size:14vw;font-weight:900;color:#FFB000;line-height:1}#p{font-size:5vw;font-weight:800;color:#FF6B70}
.bot{display:grid;grid-template-columns:1fr 1fr;padding:0 3vw 3vh;font-size:3.5vw}.pn{color:#FF6B70;font-weight:800}.pn.q{opacity:.4}.sh{color:#bbb}
#ov{position:fixed;inset:30vh 10vw;background:#AF2E32;border-radius:3vw;display:none;place-items:center;text-align:center;font-weight:900;font-size:6vw}#ov b{font-size:14vw;display:block}
</style></head><body onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()">
<div class="top"><div class="tm"><div class="nm" id="h"></div><div class="g tnum" id="g0"></div></div><div class="mid"><div id="c" class="tnum"></div><div id="p"></div></div><div class="tm"><div class="nm" id="a"></div><div class="g tnum" id="g1"></div></div></div>
<div></div><div class="bot"><div><div class="sh">SKOTT <b class="tnum" id="s0"></b></div><div id="u0"></div></div><div style="text-align:right"><div class="sh">SKOTT <b class="tnum" id="s1"></b></div><div id="u1"></div></div></div>
<div id="ov"></div><script src="clock.js"></script><script>const $=i=>document.getElementById(i);
MK.view(s=>{$('h').textContent=s.home;$('a').textContent=s.away;$('g0').textContent=s.goals[0];$('g1').textContent=s.goals[1];$('c').textContent=MK.fmtShown(s);
$('p').textContent=MK.pname(s.period).toUpperCase()+(s.period==='PAUS'&&s.next?' · NÄSTA '+s.next:'');$('s0').textContent=s.shots[0];$('s1').textContent=s.shots[1];$('u0').innerHTML=MK.pensHTML(s,0,'pn');$('u1').innerHTML=MK.pensHTML(s,1,'pn');
const o=MK.overlay(s);$('ov').style.display=o?'grid':'none';if(o)$('ov').innerHTML=`<div>${o.k}<b class="tnum">${o.v}</b></div>`})</script></body></html>
