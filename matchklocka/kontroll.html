<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matchklocka – Kontroll</title><link rel="stylesheet" href="style.css"><style>
main{padding:12px;display:grid;gap:12px;grid-template-columns:1fr 1fr}.box{background:#151515;border-radius:12px;padding:12px;border-top:6px solid #AF2E32}
.full{grid-column:1/-1}h2{margin:0 0 8px;color:#FF6B70;font-size:18px}
button{font-size:18px;padding:8px 14px;margin:3px;border:2px solid #AF2E32;background:#222;color:#fff;border-radius:8px;font-weight:700;cursor:pointer}
button.on{background:#AF2E32;border-color:#fff}input{font-size:18px;padding:6px;border-radius:6px;border:2px solid #AF2E32;width:90px}input.w{width:200px}
#clk{font-size:110px;font-weight:900;text-align:center;line-height:1}#clk.run{color:#5f5}#st{text-align:center;color:#bbb}
.big{font-size:64px;font-weight:900;text-align:center}.pen{display:flex;align-items:center;gap:6px;background:#222;border-radius:6px;padding:4px 8px;margin:3px 0}.pen.q{opacity:.5}
#ov{text-align:center;font-size:26px;color:#FFB000;font-weight:900}@media(max-width:800px){main{grid-template-columns:1fr}}
</style></head><body><header><div><div id="hT">MATCHKLOCKA</div><div id="hM"></div><div id="hW">Kontrollskärm · mellanslag = start/stopp</div></div></header>
<main>
<div class="box full"><div id="clk" class="tnum">20:00</div><div id="st"></div><div id="ov"></div><div style="text-align:center">
<button id="go" style="font-size:28px;padding:12px 40px">START</button>
<button data-a="-60000">−1 min</button><button data-a="-1000">−1 s</button><button data-a="1000">+1 s</button><button data-a="60000">+1 min</button>
<input id="tset" placeholder="mm:ss"><button id="tsetb">Sätt tid</button><br>
<span id="per"></span> | Räkna: <button id="dn">NER</button><button id="up">UPP</button> | <button id="pb">Powerbreak</button><button id="ovx">Avbryt TO/PB</button></div></div>
<div class="box" id="t0"></div><div class="box" id="t1"></div>
<div class="box full"><h2>Match (swehockey)</h2>Matchnummer <input id="gid" style="width:120px" placeholder="1116151"> <button id="gidb">Hämta lag</button> <span id="gmsg" style="color:#bbb"></span></div>
<div class="box full"><h2>Inställningar</h2>Periodlängd <input id="lP" type="number"> min · Paus <input id="lPAUS" type="number"> min · OT <input id="lOT" type="number"> min (5/20) · Powerbreak <input id="lPB" type="number"> s
<button id="rst">Nollställ match</button></div>
</main><script src="clock.js"></script><script>
const $=i=>document.getElementById(i),s0=MK.init();
const parse=v=>{const m=String(v).trim().match(/^(\d+)(?::(\d{1,2}))?$/);return m?(+m[1]*60+(+(m[2]||0)))*1000:null};
$('per').innerHTML=['P1','P2','P3','OT','PAUS'].map(p=>`<button data-p="${p}">${p}</button>`).join('');
function team(t){const s=MK.state;$('t'+t).innerHTML=`<h2>${t?'Borta':'Hemma'}</h2><input class="w" value="${t?s.away:s.home}" onchange="MK.state.${t?'away':'home'}=this.value;MK.save()">
<div class="big tnum">${s.goals[t]}</div><div style="text-align:center"><button onclick="MK.goal(${t},1)">MÅL +</button><button onclick="MK.goal(${t},-1)">Mål −</button></div>
<div style="text-align:center">Skott <b class="tnum" id="sh${t}">${s.shots[t]}</b> <button onclick="MK.shot(${t},1)">+</button><button onclick="MK.shot(${t},-1)">−</button></div>
<h2 style="margin-top:10px">Utvisningar</h2>Nr <input id="pn${t}" list="dl${t}" style="width:70px" oninput="$('pnm${t}').textContent=MK.pname2(MK.state,${t},this.value)"> <span id="pnm${t}" style="color:#FF6B70"></span><datalist id="dl${t}">${((s.rosters||[])[t]||[]).map(p=>`<option value="${p.no}">${p.name} (${p.pos})</option>`).join('')}</datalist><br> <button onclick="pen(${t},2)">2</button><button onclick="pen(${t},5)">5</button><button onclick="pen(${t},10)">10</button>
<div id="pl${t}"></div><details><summary style="color:#bbb;cursor:pointer">Laglista (klicka nr)</summary>${((s.rosters||[])[t]||[]).map(p=>`<button style="font-size:13px;padding:3px 6px" onclick="$('pn${t}').value='${p.no}';$('pnm${t}').textContent='${p.name.replace(/'/g,'')}'">${p.no} ${p.name}</button>`).join('')||'<i>Ingen laglista – skriv nr manuellt</i>'}</details><button onclick="MK.setTimeout_(${t})">Timeout 30 s</button>`}
function pen(t,m){const n=$('pn'+t).value.trim()||'?';MK.addPen(t,n,m);$('pn'+t).value=''}
function pens(t){const s=MK.state,act=MK.activePens(s,t);$('pl'+t).innerHTML=s.pens[t].map(p=>`<div class="pen${act.includes(p)||p.min===10?'':' q'}">#${p.nr} ${MK.pname2(s,t,p.nr)} (${p.min}) <b class="tnum" style="flex:1">${MK.fmtP(MK.penLeft(s,p,t))}</b>
<input style="width:70px" placeholder="mm:ss" onchange="const v=parse(this.value);v!=null&&MK.editPen(${t},${p.id},v)"><button onclick="MK.delPen(${t},${p.id})">✕</button></div>`).join('')}
let sig='';function render(){const s=MK.state,k=JSON.stringify([s.gid,(s.rosters||[]).length,s.home,s.away,s.goals,s.shots,s.pens.map(x=>x.length)]);
 if(k!==sig&&!document.activeElement.matches('input')){sig=k;team(0);team(1)}
 $('hM').textContent=s.home+' – '+s.away;$('clk').textContent=MK.fmtShown(s);$('clk').className='tnum'+(s.clock.running?' run':'');
 $('go').textContent=s.clock.running?'STOPP':'START';$('st').textContent=MK.pname(s.period)+(s.clock.running?' · klockan går':' · stoppad');
 document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===s.period));$('dn').classList.toggle('on',MK.dir(s)==='down');$('up').classList.toggle('on',MK.dir(s)==='up');
 const o=MK.overlay(s);$('ov').textContent=o?o.k+' '+o.v:'';pens(0);pens(1);
 for(const x of['P','PAUS','OT','PB'])if(document.activeElement!==$('l'+x))$('l'+x).value=s.len[x]||90;
 if(s.clock.running&&MK.remain(s)<=0)MK.stop();}
setInterval(()=>{if(!document.activeElement.matches('#pl0 input,#pl1 input'))render();else{$('clk').textContent=MK.fmtShown(MK.state)}},50);MK.on(()=>{sig='';render()});
$('go').onclick=MK.toggle;document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>MK.adjust((MK.dir(MK.state)==='up'&&MK.state.period!=='PAUS'?-1:1)*+b.dataset.a));
$('tsetb').onclick=()=>{const v=parse($('tset').value);if(v!=null)MK.setShown(v)};
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>MK.setPeriod(b.dataset.p));
$('dn').onclick=()=>MK.setDir('down');$('up').onclick=()=>MK.setDir('up');$('pb').onclick=()=>MK.powerbreak(true);$('ovx').onclick=()=>{MK.state.timeout=null;MK.powerbreak(false)};
for(const x of['P','PAUS','OT','PB'])$('l'+x).onchange=e=>{MK.state.len[x]=+e.target.value;MK.save()};
$('gid').value=MK.state.gid||'1112958';$('gidb').onclick=async()=>{$('gmsg').textContent='Hämtar…';try{const t=await MK.loadGame($('gid').value.trim());$('gmsg').textContent=`OK: ${t[0].name} (${t[0].players.length}) – ${t[1].name} (${t[1].players.length})`;sig=''}catch(e){$('gmsg').textContent='Misslyckades ('+e.message+') – fyll i lagnamn/nummer manuellt'}};
$('rst').onclick=()=>confirm('Nollställa matchen?')&&MK.reset();
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.target.matches('input')){e.preventDefault();MK.toggle()}});render();
</script></body></html>
