<!doctype html><html lang="sv"><head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta charset="utf-8"><title>NDI – Scorebug</title><link rel="stylesheet" href="style.css?v=20261027-1329"><script src="ndi.js?v=20261027-1329"></script><style>
.bug{position:absolute;display:flex;flex-direction:column;align-items:flex-start;gap:6px;filter:drop-shadow(0 6px 14px #000a)}
.tl{left:60px;top:50px}.tr{right:60px;top:50px;align-items:flex-end}.bl{left:60px;bottom:60px}.br{right:60px;bottom:60px;align-items:flex-end}.tc{left:50%;top:50px;transform:translateX(-50%);align-items:center}.bc{left:50%;bottom:60px;transform:translateX(-50%);align-items:center}
.row{display:flex;align-items:stretch;height:72px;border-radius:8px;overflow:hidden;font-weight:900;font-size:36px}
.t{display:flex;align-items:center;gap:14px;padding:0 20px;min-width:150px;letter-spacing:1px}.t .s{font-size:46px;min-width:40px;text-align:center}
.t0{background:#AF2E32;color:#fff}.t1{background:#FFD100;color:#000}
.c{background:#111;display:flex;align-items:center;gap:16px;padding:0 22px;color:#fff}.c .p{background:#fff;color:#000;border-radius:5px;padding:2px 10px;font-size:26px}.c .k{font-size:44px;color:#FFB000}
.pp{display:flex;gap:6px;font-weight:900;font-size:24px}.pp span{border-radius:5px;padding:4px 12px}
.ex{background:#111;color:#FFB000;border-radius:5px;padding:4px 12px;font-weight:900;font-size:24px}
</style><script>window.APPV='20261027-1329';(()=>{const chk=()=>fetch('../version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{if(j.v&&j.v!==window.APPV&&!document.getElementById('appnew')){const b=document.createElement('div');b.id='appnew';b.textContent='Ny version finns – klicka här för att ladda om';b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#B00020;color:#fff;font:900 20px sans-serif;padding:12px;text-align:center;cursor:pointer';b.onclick=()=>location.reload();document.body.appendChild(b)}}).catch(()=>{});setInterval(chk,60000);addEventListener('focus',chk);setTimeout(chk,3000)})()</script></head><body><div class="stage"><div class="bug" id="bug"><div class="row"><div class="t t0"><span id="h"></span><span class="s tnum" id="g0"></span></div><div class="t t1"><span class="s tnum" id="g1"></span><span id="a"></span></div><div class="c"><span class="p" id="p"></span><span class="k tnum" id="c"></span></div></div><div class="pp" id="pp"></div></div></div>
<script src="clock.js?v=20261027-1329"></script><script>const $=i=>document.getElementById(i);$('bug').classList.add(['tl','tr','bl','br','tc','bc'].includes(NDI.pos)?NDI.pos:'tl');NDI.fit();
MK.view(s=>{$('h').textContent=NDI.short(s.home).slice(0,12);$('a').textContent=NDI.short(s.away).slice(0,12);$('g0').textContent=s.goals[0];$('g1').textContent=s.goals[1];$('c').textContent=MK.fmtShown(s);
$('p').textContent=/^(P[1-9]|OT\d*)$/.test(s.period)?s.period:MK.pname(s.period).toUpperCase();
let h='';[0,1].forEach(t=>s.pens[t].filter(p=>!p.coin&&MK.penLeft(s,p,t)>0&&p.kind!=='mis'&&p.kind!=='gm').forEach(p=>{h+=`<span style="background:${NDI.col(t)};color:${NDI.fg(t)}">${p.nr?'#'+p.nr+' ':''}<span class="tnum">${MK.fmtP(MK.penLeft(s,p,t))}</span></span>`}));
const st=MK.strength(s);if(st&&st.pp!=null)h+=`<span class="ex">POWERPLAY ${NDI.short(st.pp?s.away:s.home)}</span>`;else if(st&&st.txt)h+=`<span class="ex">${st.txt.toUpperCase()}</span>`;$('pp').innerHTML=h})</script><script>/* Time of day: dölj matchdata, visa klockslag */MK.idleLayer({bg:'#0d0d0dcc',big:'12vh',s:'3.5vh',css:'#idlelayer{inset:auto;top:40px;left:40px;padding:14px 36px;border-radius:14px}'});MK.todHide('bug')</script></body></html>
