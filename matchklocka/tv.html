<!doctype html><html lang="sv"><head><meta charset="utf-8"><title>Matchklocka – TV</title><link rel="stylesheet" href="style.css"><style>
body{background:transparent}body.green{background:#00b140}.bug{position:fixed;left:40px;top:40px;display:flex;align-items:stretch;font-weight:800;font-size:28px;box-shadow:0 4px 12px #0008;border-radius:6px;overflow:hidden}
.bug>div{padding:6px 14px;display:flex;align-items:center}.t{background:#111}.t.h{border-left:8px solid #AF2E32}.t.a{border-left:8px solid #fff}.sc{background:#AF2E32;min-width:48px;justify-content:center}
.ck{background:#000;color:#FFB000;min-width:120px;justify-content:center}.pr{background:#222;color:#FF6B70}.ex{position:fixed;left:40px;top:92px;display:flex;gap:6px;font-size:20px;font-weight:800}
.ex>div{background:#111;padding:4px 10px;border-radius:0 0 6px 6px}.ex .pp{background:#FFB000;color:#000}.ex .q{opacity:.6}
</style></head><body><div class="bug"><div class="t h" id="h"></div><div class="sc tnum" id="g0"></div><div class="t a" id="a"></div><div class="sc tnum" id="g1"></div><div class="pr" id="p"></div><div class="ck tnum" id="c"></div></div>
<div class="ex" id="ex"></div><script src="clock.js"></script><script>const $=i=>document.getElementById(i);
if(new URLSearchParams(location.search).get('bg')==='green')document.body.classList.add('green');
const ab=n=>n.replace(/\s*HC$/,'').slice(0,3).toUpperCase();
MK.view(s=>{$('h').textContent=ab(s.home);$('a').textContent=ab(s.away);$('g0').textContent=s.goals[0];$('g1').textContent=s.goals[1];$('p').textContent=MK.pshort(s.period);$('c').textContent=MK.fmtShown(s);
const o=MK.overlay(s);$('ex').innerHTML=(o?`<div class="pp">${o.k} ${o.v}</div>`:'')+[0,1].map(t=>s.pens[t].filter(p=>MK.penLeft(s,p,t)>0).map(p=>`<div class="${MK.activePens(s,t).includes(p)||p.min===10?'':'q'}">${ab(t?s.away:s.home)} #${p.nr} ${MK.fmtP(MK.penLeft(s,p,t))}</div>`).join('')).join('')})</script></body></html>
